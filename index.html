<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نظام حضور الموظفين</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 25px;
    }

    input {
      width: 90%;
      padding: 14px;
      font-size: 18px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      text-align: center;
      box-sizing: border-box;
    }

    button {
      width: 95%;
      padding: 14px;
      margin: 8px 0;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #checkBtn {
      background: #1976d2;
      color: white;
    }

    #cameraBtn {
      background: #f57c00;
      color: white;
    }

    #captureBtn {
      background: #388e3c;
      color: white;
    }

    #submitBtn {
      background: #7b1fa2;
      color: white;
    }

    #video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      margin-top: 15px;
      display: none;
    }

    #canvas {
      display: none;
    }

    #employee {
      margin: 15px 0;
      font-size: 18px;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
      font-size: 17px;
      font-weight: bold;
      white-space: pre-line;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📋 نظام حضور الموظفين</h1>

  <input
    type="text"
    id="code"
    placeholder="أدخل كود الموظف"
    inputmode="numeric"
  >

  <button id="checkBtn" onclick="checkEmployee()">
    🔎 التحقق من الموظف
  </button>

  <div id="employee"></div>

  <button
    id="cameraBtn"
    onclick="startCamera()"
    style="display:none;"
  >
    📷 فتح الكاميرا
  </button>

  <video
    id="video"
    autoplay
    playsinline
  ></video>

  <button
    id="captureBtn"
    onclick="capturePhoto()"
    style="display:none;"
  >
    📸 التقاط الصورة
  </button>

  <canvas id="canvas"></canvas>

  <button
    id="submitBtn"
    onclick="submitAttendance()"
    style="display:none;"
  >
    ✅ تسجيل الحضور / الانصراف
  </button>

  <div id="message"></div>

</div>


<script>

let employeeName = "";
let imageData = null;
let cameraStream = null;


const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzNVT-4K2g9vqwFbOtmfa3fPhR2c-zhklpMNjLyiZSgLT65YiOspddQbsJwVjueZrvQrg/exec";


function showMessage(message) {

  document.getElementById("message").innerText =
    message;

}


function checkEmployee() {

  const code =
    document.getElementById("code").value.trim();

  if (!code) {

    showMessage(
      "من فضلك أدخل كود الموظف"
    );

    return;
  }

  showMessage(
    "جاري التحقق..."
  );


  fetch(
    SCRIPT_URL +
    "?action=checkEmployee&code=" +
    encodeURIComponent(code)
  )

  .then(function(response) {

    return response.json();

  })

  .then(function(data) {

    if (!data.success) {

      showMessage(
        "❌ " + data.message
      );

      return;
    }

    employeeName =
      data.name;

    document.getElementById("employee").innerText =
      "👤 الموظف: " +
      employeeName;


    document.getElementById("cameraBtn").style.display =
      "block";


    showMessage(
      "تم التحقق من الموظف ✅"
    );

  })

  .catch(function(error) {

    showMessage(
      "حدث خطأ أثناء الاتصال بالنظام"
    );

  });

}


async function startCamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showMessage(
        "❌ الكاميرا غير مدعومة في هذا المتصفح"
      );

      return;
    }


    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject =
      cameraStream;


    video.style.display =
      "block";


    document.getElementById("captureBtn").style.display =
      "block";


    showMessage(
      "الكاميرا جاهزة 📷"
    );

  }

  catch (error) {

    showMessage(
      "خطأ الكاميرا: " +
      error.name +
      " - " +
      error.message
    );

  }

}


function capturePhoto() {

  const video =
    document.getElementById("video");


  const canvas =
    document.getElementById("canvas");


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    showMessage(
      "انتظر حتى تظهر صورة الكاميرا ثم حاول مرة أخرى."
    );

    return;
  }


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  const context =
    canvas.getContext("2d");


  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  imageData =
    canvas.toDataURL(
      "image/jpeg",
      0.8
    );


  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

  }


  video.srcObject = null;


  video.style.display =
    "none";


  document.getElementById("captureBtn").style.display =
    "none";


  document.getElementById("submitBtn").style.display =
    "block";


  showMessage(
    "تم التقاط الصورة ✅"
  );

}


function submitAttendance() {

  const code =
    document.getElementById("code").value.trim();


  if (!code) {

    showMessage(
      "من فضلك أدخل كود الموظف"
    );

    return;
  }


  if (!imageData) {

    showMessage(
      "لم يتم التقاط الصورة"
    );

    return;
  }


  showMessage(
    "جاري تسجيل الحضور... ⏳"
  );


  const data = {

    code: code,

    image: imageData

  };


  fetch(
    SCRIPT_URL,
    {

      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify(data)

    }
  )

  .then(function(response) {

    return response.json();

  })

  .then(function(result) {

    if (result.success) {

      showMessage(
        "🎉 " +
        result.message
      );

      document.getElementById("submitBtn").style.display =
        "none";

    } else {

      showMessage(
        "❌ " +
        result.message
      );

    }

  })

  .catch(function(error) {

    showMessage(
      "حدث خطأ أثناء تسجيل الحضور"
    );

  });

}

</script>

</body>
</html>
