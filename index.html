<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام حضور الموظفين</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 25px;
    }

    input {
      width: 90%;
      padding: 14px;
      font-size: 18px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      text-align: center;
    }

    button {
      width: 95%;
      padding: 14px;
      margin: 8px 0;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      margin-top: 15px;
    }

    #canvas {
      display: none;
    }

    #message {
      margin-top: 15px;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📋 نظام حضور الموظفين</h1>

  <input
    type="text"
    id="code"
    placeholder="أدخل كود الموظف"
    inputmode="numeric"
  >

  <button onclick="checkEmployee()">
    🔎 التحقق من الموظف
  </button>

  <div id="employee"></div>

  <button id="locationBtn" onclick="getLocation()" style="display:none;">
    📍 التحقق من الموقع
  </button>

  <video id="video" autoplay playsinline style="display:none;"></video>

  <button id="cameraBtn" onclick="startCamera()" style="display:none;">
    📷 فتح الكاميرا
  </button>

  <button id="captureBtn" onclick="capturePhoto()" style="display:none;">
    📸 التقاط الصورة
  </button>

  <canvas id="canvas"></canvas>

  <button id="submitBtn" onclick="submitAttendance()" style="display:none;">
    ✅ تسجيل الحضور / الانصراف
  </button>

  <div id="message"></div>

</div>

<script>

let employeeName = "";
let latitude = null;
let longitude = null;
let accuracy = null;
let imageData = null;
let cameraStream = null;

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzNVT-4K2g9vqwFbOtmfa3fPhR2c-zhklpMNjLyiZSgLT65YiOspddQbsJwVjueZrvQrg/exec";


function showMessage(message) {
  document.getElementById("message").innerText = message;
}


function checkEmployee() {

  const code =
    document.getElementById("code").value.trim();

  if (!code) {
    showMessage("من فضلك أدخل كود الموظف");
    return;
  }

  showMessage("جاري التحقق...");

  fetch(
    SCRIPT_URL +
    "?action=checkEmployee&code=" +
    encodeURIComponent(code)
  )
  .then(response => response.json())
  .then(data => {

    if (!data.success) {
      showMessage(data.message);
      return;
    }

    employeeName = data.name;

    document.getElementById("employee").innerText =
      "الموظف: " + employeeName;

    document.getElementById("locationBtn").style.display =
      "block";

    showMessage("تم التحقق من الموظف ✅");

  })
  .catch(error => {

    showMessage(
      "حدث خطأ أثناء الاتصال بالنظام"
    );

  });
}


function getLocation() {

  if (!navigator.geolocation) {
    showMessage("هذا الجهاز لا يدعم تحديد الموقع");
    return;
  }

  const SITE_LAT = 27.849708;
const SITE_LNG = 41.724594;
  
  const ALLOWED_RADIUS = 15;
  const MAX_ACCURACY = 100;
  const TOTAL_READINGS = 5;

  let readings = [];

  showMessage("📍 جاري تحسين دقة الموقع...");

  function calculateDistance(lat, lng) {

    const R = 6371000;

    const dLat =
      (SITE_LAT - lat) * Math.PI / 180;

    const dLon =
      (SITE_LNG - lng) * Math.PI / 180;

    const lat1 =
      lat * Math.PI / 180;

    const lat2 =
      SITE_LAT * Math.PI / 180;

    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1) *
      Math.cos(lat2) *
      Math.sin(dLon / 2) *
      Math.sin(dLon / 2);

    return R *
      2 *
      Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1 - a)
      );
  }

  function takeReading() {

    showMessage(
      "📍 جاري تحديد الموقع...\n" +
      "القراءة " +
      (readings.length + 1) +
      " من " +
      TOTAL_READINGS
    );

    navigator.geolocation.getCurrentPosition(

      function(position) {

        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const acc = position.coords.accuracy;

        const distance =
          calculateDistance(lat, lng);

        readings.push({
          latitude: lat,
          longitude: lng,
          accuracy: acc,
          distance: distance
        });

        // لو حصلنا على قراءة دقيقة ومكانها داخل النطاق
        if (
          acc <= MAX_ACCURACY &&
          distance <= ALLOWED_RADIUS
        ) {

          latitude = lat;
          longitude = lng;
          accuracy = acc;

          showMessage(
            "✅ الموقع صحيح.\n" +
            "المسافة: " +
            Math.round(distance) +
            " متر.\n" +
            "دقة GPS: " +
            Math.round(acc) +
            " متر."
          );

          document.getElementById("cameraBtn").style.display =
            "block";

          return;
        }

        // لو لسه فيه قراءات متبقية
        if (readings.length < TOTAL_READINGS) {

          setTimeout(
            takeReading,
            1000
          );

          return;
        }

        // انتهت كل المحاولات
        const validReadings =
          readings.filter(function(r) {
            return r.accuracy <= MAX_ACCURACY;
          });

        if (validReadings.length === 0) {

          showMessage(
            "❌ لا يمكن تسجيل الحضور.\n" +
            "لم نتمكن من الحصول على دقة GPS مناسبة.\n" +
            "أفضل دقة حصلنا عليها: " +
            Math.round(
              Math.min.apply(
                null,
                readings.map(function(r) {
                  return r.accuracy;
                })
              )
            ) +
            " متر."
          );

          return;
        }

        // اختيار القراءة الأقرب للموقع من القراءات المقبولة
        validReadings.sort(
          function(a, b) {
            return a.distance - b.distance;
          }
        );

        const best =
          validReadings[0];

        latitude = best.latitude;
        longitude = best.longitude;
        accuracy = best.accuracy;

        if (best.distance > ALLOWED_RADIUS) {

          showMessage(
            "❌ أنت خارج نطاق موقع العمل.\n" +
            "أقرب قراءة: " +
            "أقرب قراءة: " +
best.distance.toFixed(2) +
" متر."
          );

          return;
        }

        showMessage(
          "✅ الموقع صحيح.\n" +
          "المسافة: " +
best.distance.toFixed(2) +
" متر.\n"
          "دقة GPS: " +
          Math.round(best.accuracy) +
          " متر."
        );

        document.getElementById("cameraBtn").style.display =
          "block";
      },

      function(error) {

        if (readings.length < TOTAL_READINGS) {

          setTimeout(
            takeReading,
            1000
          );

          return;
        }

        showMessage(
          "❌ تعذر تحديد موقعك.\n" +
          error.message
        );
      },

      {
        enableHighAccuracy: true,
        timeout: 60000,
        maximumAge: 0
      }
    );
  }

  takeReading();
}
async function startCamera() {

  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });

    const video =
      document.getElementById("video");

    video.srcObject =
      cameraStream;

    video.style.display =
      "block";

    document.getElementById("captureBtn").style.display =
      "block";

    showMessage("الكاميرا جاهزة 📷");

  }

  catch (error) {

    showMessage(
      "خطأ الكاميرا: " +
      error.name +
      " - " +
      error.message
    );

  }

}


function capturePhoto() {

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const context =
    canvas.getContext("2d");

  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  imageData =
    canvas.toDataURL(
      "image/jpeg",
      0.8
    );

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(track => track.stop());

  }

  video.style.display =
    "none";

  document.getElementById("captureBtn").style.display =
    "none";

  document.getElementById("submitBtn").style.display =
    "block";

  showMessage(
    "تم التقاط الصورة ✅"
  );

}


function submitAttendance() {

  const code =
    document.getElementById("code").value.trim();

  if (!latitude || !longitude) {
    showMessage("لم يتم تحديد الموقع");
    return;
  }

  if (!imageData) {
    showMessage("لم يتم التقاط الصورة");
    return;
  }

  showMessage(
    "جاري تسجيل الحضور..."
  );

  const data = {

    code: code,

    latitude: latitude,

    longitude: longitude,

    accuracy: accuracy,

    image: imageData

  };

  fetch(
    SCRIPT_URL,
    {

      method: "POST",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify(data)

    }
  )

  .then(response =>
    response.json()
  )

  .then(result => {

    showMessage(
      result.message
    );

  })

  .catch(error => {

    showMessage(
      "حدث خطأ أثناء تسجيل الحضور"
    );

  });

}

</script>

</body>
</html>
